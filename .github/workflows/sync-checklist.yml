name: Sync Application Checklist

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: internship-tracker-state
  cancel-in-progress: false

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'application-checklist') && github.event.changes.body != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Handle checkbox toggle
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_BODY: ${{ github.event.changes.body.from }}
          AFTER_BODY: ${{ github.event.issue.body }}
        run: python handle_checklist_edit.py

      - name: Commit tracker update
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/tracked_jobs.json APPLICATIONS.md
          git diff --cached --quiet || git commit -m "Update tracker from checklist toggle (issue #${{ github.event.issue.number }})"
          git push
